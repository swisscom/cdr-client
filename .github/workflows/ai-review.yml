name: AI PR Review

on:
  pull_request:
    branches: [ develop ]
    types: [ opened, ready_for_review ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build diff (capped)
        run: git diff "origin/${{ github.base_ref }}...HEAD" | head -c 30000 > diff.txt

      - name: AI review
        id: ai
        continue-on-error: true
        uses: actions/ai-inference@v1
        with:
          model: openai/gpt-4.1-mini
          system-prompt: >
            You are a strict code reviewer for a Kotlin Multiplatform and C# project.
            Review the diff and report bugs, security issues and risky changes concisely.
            If nothing significant is found, say so briefly.
          prompt-file: diff.txt

      - name: Post review comment
        if: steps.ai.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file "${{ steps.ai.outputs.response-file }}"
